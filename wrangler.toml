# Cloudflare Pages configuration for the PPB Pricing Dashboard.
#
# Presence layer: the PricingRoom Durable Object lives in the separate
# `pricing-realtime` Worker; /api/room forwards authenticated WebSocket upgrades to
# it through this binding. Until a build picks the binding up, /api/room returns 503
# and the dashboard behaves exactly as before.

name = "priceloadanalysis"
pages_build_output_dir = "."
compatibility_date = "2026-06-02"

[[durable_objects.bindings]]
name = "ROOM"
class_name = "PricingRoom"
script_name = "pricing-realtime"
